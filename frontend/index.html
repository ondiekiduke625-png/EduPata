<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPata Registration</title>
</head>
<body>

  <h1>EduPata</h1>
  <h2>Student Registration</h2>

  <form id="registrationForm">
    <label>Full Name</label><br>
    <input type="text" id="name" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" id="phone" required><br><br>

    <label>Education Level</label><br>
    <select id="educationLevel" required>
      <option value="">Select education level</option>
      <option value="Secondary">Secondary</option>
      <option value="College">College</option>
      <option value="University">University</option>
    </select><br><br>

    <button type="submit">Register</button>
  </form>

  <p id="message"></p>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const educationLevel = document.getElementById("educationLevel").value;
      const message = document.getElementById("message");

      message.textContent = "Registering...";

      try {
        const response = await fetch("https://edupata.onrender.com/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: name,
            phone: phone,
            educationLevel: educationLevel
          })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = "Registration successful!";
        } else {
          message.textContent = data.message || "Registration failed.";
        }

      } catch (error) {
        message.textContent = "Could not connect to EduPata server.";
      }
    });
  </script>

</body>
</html>
